openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    This is a server-side application for managing contacts with user registration, login, and password recovery via email.
tags:
  - name: Authentication
    description: User registration and login operations
  - name: Contacts
    description: Contact list management
  - name: Users
    description: User profile operations
servers:
  - url: http://localhost:3000
  - url: https://contacts-app-hw-03.onrender.com
paths:
  /contacts:
    get: 
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch: 
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
