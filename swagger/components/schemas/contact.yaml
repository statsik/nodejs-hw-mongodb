type: object
required:
  - _id
  - name
  - phoneNumber
  - isFavourite
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: 'contact@gmail.com'
  phoneNumber:
    description: "Contact's age"
    type: string
    example: 38000000
  isFavourite:
    description: "Contact's average mark. Should be between work, home or personal"
    type: number
    example: false
  contactType:
    description: 'Whether is contact'
    type: boolean
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

