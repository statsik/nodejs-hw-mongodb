    tags:
      - Contacts
    summary: Get all contacts
    operationId: getAllContacts
    description: Get a paginated list of all contacts with filters
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number for pagination
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: Number of contacts per page
      - in: query
        name: isFavourite
        schema:
          type: boolean
        description: Filter contacts marked as favourite
      - in: query
        name: contactType
        schema:
          type: string
          enum: [work, home, personal]
        description: Filter contacts by type
    responses:
      '200':
        description: Successfully retrieved contacts
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - message
                - data
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Successfully retrieved contacts
                data:
                  type: object
                  required:
                    - contacts
                    - page
                    - limit
                    - totalPages
                    - totalContacts
                  properties:
                    contacts:
                      type: array
                      items:
                        $ref: ../../components/schemas/contact.yaml
                    page:
                      type: integer
                      example: 1
                    limit:
                      type: integer
                      example: 10
                    totalPages:
                      type: integer
                      example: 5
                    totalContacts:
                      type: integer
                      example: 50
      '401':
        $ref: ../../components/responses/401.yaml
      '500':
        $ref: ../../components/responses/500.yaml