tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Get a list of all contacts with pagination
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Current page number
    required: false
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    description: Number of items per page
    required: false
    schema:
      type: integer
      default: 10
responses:
  '200':
    description: Successfully retrieved all contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
            - pagination
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved all contacts
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
            pagination:
              type: object
              required:
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 35
                totalPages:
                  type: integer
                  example: 4
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
