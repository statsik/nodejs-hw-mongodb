tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: 'Update a contact with given ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: "1231232132"
          isFavourite:
            description: "Is contact marked as favourite"
            type: boolean
            example: true
          contactType:
            description: "Type of contact"
            type: string
            enum: ["work", "home", "personal"]
          photo:
            description: "New contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              $ref: ../../components/schemas/contact.yaml
  '404':
    $ref: ../../components/responses/404.yaml
